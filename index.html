<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reselling Profit Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">
        <h1>Reselling Profit Calculator</h1>
        <p>Calculate your profit easily.</p>

        <label>Buying Price (₹)</label>
        <input type="number" id="buyingPrice" placeholder="Example: 100">

        <label>Selling Price (₹)</label>
        <input type="number" id="sellingPrice" placeholder="Example: 200">

        <label>Other Expenses (₹)</label>
        <input type="number" id="expenses" placeholder="Example: 20">

        <button onclick="calculateProfit()">Calculate Profit</button>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>

</body>
</html>
